services:
  app:
    container_name: app
    build: .
    volumes:
      - ./config.yaml:/app/config.yaml
    ports:
      - "8080:8080"
    networks:
      - public
      - backend
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    container_name: postgresql
    image: postgres:18-alpine
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U quasar -d quasar" ]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: quasar
      POSTGRES_USER: quasar
      POSTGRES_PASSWORD: quasar-dev
      PGDATA: /var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data

networks:
  public:
  backend:
    internal: true

volumes:
  db-data:
